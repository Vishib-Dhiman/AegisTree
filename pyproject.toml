[project]
name = "aegistree"
version = "0.1.0"
description = "Dual-Engine Sovereign Second Brain for Air-Gapped Engineering Teams"
readme = "PROJECT_DOSSIER.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "networkx>=3.2",
    "pydantic>=2.6.0",
    "pytest>=8.0.0",
    "rich>=13.7.0",
    "uvicorn>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
